<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Chaldeas</title>
  <link rel="icon" type="image/x-icon" href="/logo.ico" />
  <link rel="stylesheet" href="/style.css?v=2" />
</head>
<body>
  <!-- 右下角低调管理员入口 -->
  <a href="/admin.html" class="corner-link">管理员</a>

  <!-- 进入房间 -->
  <div id="join" class="join-screen">
    <div class="join-card">
      <h1>Chaldeas</h1>
      <label>房间号
        <input id="roomInput" placeholder="由管理员创建的房间名喵~" autocomplete="off" />
      </label>
      <label>房间密码（若管理员设置了密码）
        <span class="pw-wrap">
          <input id="pwInput" type="text" class="secure" placeholder="留空则无需密码喵~" autocomplete="new-password" />
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="显示或隐藏密码" title="显示/隐藏密码"></button>
        </span>
      </label>
      <button id="joinBtn" class="btn block">进入喵~</button>
      <p id="joinErr" class="err"></p>
    </div>
  </div>

  <!-- 聊天主界面 -->
  <div id="chat" class="chat-screen hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span id="identity" class="identity"></span>
      </div>
      <div class="topbar-center">
        <span id="roomLabel" class="room-name"></span>
        <span id="presence" class="presence"></span>
      </div>
      <div class="actions">
        <button id="shareBtn" class="btn ghost sm" title="复制分享链接">分享</button>
        <button id="leaveBtn" class="btn ghost sm" title="离开房间">退出</button>
      </div>
    </header>
    <div id="messages" class="messages"></div>
    <div id="status" class="status-bar"></div>

    <!-- 粘贴/选择图片后的 inline 预览（微信风格） -->
    <div id="imagePreviewArea" class="image-preview-area hidden">
      <div class="image-preview-thumb-wrap">
        <img id="imagePreviewThumb" alt="待发送图片" />
        <button id="imagePreviewRemove" class="image-preview-remove" type="button" title="取消发送">✕</button>
      </div>
      <span class="image-preview-hint">点击缩略图可放大预览，按回车或点击发送即可发出喵~</span>
    </div>

    <!-- 缩略图点击放大灯箱 -->
    <div id="imageLightbox" class="image-lightbox hidden">
      <img id="imageLightboxImg" alt="图片预览" />
    </div>

    <footer class="composer">
      <button id="emojiBtn" class="btn ghost icon" type="button" title="表情" aria-label="表情">😊</button>
      <button id="imgBtn" class="btn ghost icon hidden" title="发送图片" aria-hidden="true">🖼️</button>
      <input id="fileInput" type="file" accept="image/*" hidden />
      <button id="fileBtn" class="btn ghost icon" title="发送文件">📎</button>
      <input id="fileAllInput" type="file" hidden />
      <input id="textInput" placeholder="输入消息，回车发送…" autocomplete="off" />
      <button id="sendBtn" class="btn">发送</button>
    </footer>

    <!-- 贴吧风格表情面板（点击表情按钮弹出，点击外部收起） -->
    <div id="emojiPanel" class="emoji-panel hidden">
      <div class="emoji-tabs" id="emojiTabs"></div>
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>
  </div>

  <script src="/avatarMap.js?v=2"></script>
  <script src="/emojiData.js?v=2"></script>
  <script src="/app.js?v=2"></script>
</body>
</html>
