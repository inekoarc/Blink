services:
  blink:
    build: .
    container_name: blink
    restart: unless-stopped
    ports:
      - "7777:7777"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=7777
      - MAX_UPLOAD_MB=10
      # 从宿主机环境变量读取，避免把密码写死在文件里（部署前先 export ADMIN_PASSWORD=你的强密码）
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
